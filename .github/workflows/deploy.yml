name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Check migration status
        id: migration_check
        run: |
          set +e
          STATUS=$(npx prisma migrate status --schema=prisma/schema.prisma 2>&1)
          STATUS_EXIT=$?
          set -e
          echo "$STATUS"

          if echo "$STATUS" | grep -qi "Database schema is up to date"; then
            echo "migrations_needed=false" >> $GITHUB_OUTPUT
            echo "✅ No migrations needed"
          elif echo "$STATUS" | grep -qi "following migrations have not yet been applied"; then
            echo "migrations_needed=true" >> $GITHUB_OUTPUT
            echo "⚠️  Pending migrations detected"
          else
            echo "❌ Unable to determine migration status; refusing deployment"
            if [ "$STATUS_EXIT" -ne 0 ]; then
              exit "$STATUS_EXIT"
            fi
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Apply database migrations
        if: steps.migration_check.outputs.migrations_needed == 'true'
        run: |
          echo "🚀 Applying pending migrations to production..."
          npx prisma migrate deploy
          echo "✅ Migrations applied successfully"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Verify migration success
        if: steps.migration_check.outputs.migrations_needed == 'true'
        run: |
          STATUS=$(npx prisma migrate status 2>&1)
          if echo "$STATUS" | grep -qi "Database schema is up to date"; then
            echo "✅ Migration verification passed"
          else
            echo "❌ Migration verification failed"
            echo "$STATUS"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Deployment notification
        run: |
          echo "============================================"
          echo "✅ Production Deployment Complete"
          echo "============================================"
          echo ""
          echo "Migrations applied: ${{ steps.migration_check.outputs.migrations_needed }}"
          echo "Build status: Success"
          echo ""
          echo "Vercel will handle the actual deployment via GitHub integration"
          echo ""
